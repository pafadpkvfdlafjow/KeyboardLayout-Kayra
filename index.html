<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Keyboard</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <div id="TypeBar">
        <section id="Text"></section>
        <section id="Prompt"></section>
    </div>

    <div id="Timer">0</div>

    <div id="Main">
        <section class="row" id="row1" style = "height: 12%;">
            <div id="Escape"></div>
            <div id="F1"></div>
            <div id="F2"></div>
            <div id="F3"></div>
            <div id="F4"></div>
            <div id="F5"></div>
            <div id="F6"></div>
            <div id="F7"></div>
            <div id="F8"></div>
            <div id="F9"></div>
            <div id="F10"></div>
            <div id="F11"></div>
            <div id="F12"></div>
            <div id="prt scr"></div>
            <div id="Power"></div>
            <div id="Delete"></div>
        </section>
        <section class="row" id="row2" style = "height: 17.6%;">
            <div id="Backquote" style = "width: 4%;"></div>
            <div id="Digit1"></div>
            <div id="Digit2"></div>
            <div id="Digit3"></div>
            <div id="Digit4"></div>
            <div id="Digit5"></div>
            <div id="Digit6"></div>
            <div id="Digit7"></div>
            <div id="Digit8"></div>
            <div id="Digit9"></div>
            <div id="Digit0"></div>
            <div id="Minus"></div>
            <div id="Equal"></div>
            <div id="Backspace" style = "width: 11.5%;"></div>
            <div id="Home" ></div>
        </section>
        <section class="row" id="row3" style = "height: 17.6%;">
            <div id="Tab" style = "width: 10%;"></div>
            <div id="KeyQ"></div>
            <div id="KeyW"></div>
            <div id="KeyE"></div>
            <div id="KeyR"></div>
            <div id="KeyT"></div>
            <div id="KeyY"></div>
            <div id="KeyU"></div>
            <div id="KeyI"></div>
            <div id="KeyO"></div>
            <div id="KeyP"></div>
            <div id="BracketLeft"></div>
            <div id="BracketRight"></div>
            <div class="Enter" style = "width: 7.5%;"></div>
            <div id="PageUp" style = "margin-left: 0.5%;"></div>            
        </section>
        <section class="row" id="row4" style = "height: 17.6%;">
            <div id="CapsLock" style = "width: 11.5%;" ></div>
            <div id="KeyA"></div>
            <div id="KeyS"></div>
            <div id="KeyD"></div>
            <div id="KeyF"></div>
            <div id="KeyG"></div>
            <div id="KeyH"></div>
            <div id="KeyJ"></div>
            <div id="KeyK"></div>
            <div id="KeyL"></div>
            <div id="Semicolon"></div>
            <div id="Quote"></div>
            <div id="Backslash"></div>
            <div class="Enter" id="Enter2" style = "height: 120%;"></div>
            <div id="PageDown" style = "margin-left: 0.75%;"></div>
        </section>
         <section class="row" id="row5" style = "height: 17.6%;">
            <div id="ShiftLeft"></div>
            <div id="IntlBackslash"></div>
            <div id="KeyZ"></div>
            <div id="KeyX"></div>
            <div id="KeyC"></div>
            <div id="KeyV"></div>
            <div id="KeyB"></div>
            <div id="KeyN"></div>
            <div id="KeyM"></div>
            <div id="Comma"></div>
            <div id="Period"></div>
            <div id="Slash"></div>
            <div id="ShiftRight" style = "width: 16.5%;"></div>
            <div id="End"></div>
        </section>
        <section class="row" id="row6" style = "height: 17.6%;">

            <div id="ControlLeft"></div>
            <div id="fn"></div>
            <div id="MetaLeft"></div>
            <div id="AltLeft"></div>
            <div id="Space" style = "width: 32%;"></div>
            <div id="AltRight"></div>
            <div id="ContextMenu"></div>
            <div id="ControlRight"></div>
            <div id="ArrowLeft"></div>
            <section style = "width: 10.5%;">
                <div id="ArrowUp" style = "margin-bottom: 4%;"></div>
                <div id="ArrowDown"></div>
            </section>
            <div id="ArrowRight" style = "margin-left: 0.5%;"></div>
        </section>
    </div>

    <div id="Score">SCORE: 0</div>
    <script src="js/script.js"></script>
</body>
</html>
